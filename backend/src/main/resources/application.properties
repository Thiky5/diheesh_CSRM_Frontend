spring.application.name=csrm-backend
server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/csrm_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
csrm.jwt.secret=${CSRM_JWT_SECRET}
csrm.jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:5173,http://localhost:3000
